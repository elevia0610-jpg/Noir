    <style>
        #skill-card-2 .skill-interactive {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            background-color: var(--black);
            overflow: hidden;
        }

        #skill-card-3 .skill-interactive {
            display: grid;
            background-color: transparent;
            overflow: hidden;
            cursor: crosshair;
        }

        /* Skill Card 1 - Circle */

        #skill-card-1 .skill-interactive {
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: var(--black);
            overflow: hidden;
        }

        #skill-card-1 .circle {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background-color: var(--soft-beige);
            border: 1px solid var(--black);
            opacity: 1;
        }

        .squares-stack {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .squares-stack .square {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 80px;
            height: 80px;
            background-color: var(--soft-beige);
            border: 1px solid var(--black);
            transform: translate(-50%, -50%);
            opacity: 1;
        }

        .pixel-square {
            width: 100%;
            height: 100%;
            background-color: var(--soft-beige);
            border: 1px solid var(--black);
            box-sizing: border-box;
        }

        /* Skill Card 4 - Sunburst */

        #skill-card-4 .skill-interactive {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(5, 1fr);
            background-color: var(--black);
            overflow: hidden;
        }

        .sunburst-cell {
            position: relative;
            overflow: hidden;
        }

        .sunburst-cell svg {
            position: absolute;
            width: 500%;
            height: 500%;
        }

        /* Skill Card 5 - Stretchy Circles */

        #skill-card-5 .skill-interactive {
            position: relative;
            background-color: var(--black);
            overflow: hidden;
            cursor: pointer;
        }

        #skill-card-5 .doodle-canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #skill-card-6 .skill-interactive {
            position: relative;
            background-color: var(--black);
            overflow: hidden;
        }

        #skill-card-6 canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #skill-card-6 .instruction {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2.5rem;
            color: #d3d0ce;
            text-transform: uppercase;
            letter-spacing: 4px;
            user-select: none;
            pointer-events: none;
            text-align: center;
            z-index: 5;
        }
        /* CSS - Scoped to #skill-card-7 */
        #skill-card-7 .skill-interactive {
            position: relative;
            background-color: #232323;
            overflow: hidden;

            border-radius: 12px;
            cursor: crosshair;
        }

        #skill-card-7 .bars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 3px;
            padding: 20px;
            box-sizing: border-box;
        }

        #skill-card-7 .bars span {
            flex: 1;
            min-width: 2px;
            height: 100%;
            background: linear-gradient(to top, #d3d0ce, #d3d0ce);
            border-radius: 2px 2px 0 0;
            transform-origin: bottom center;
            transform: scaleY(0.12);
            transition: transform 0.12s ease-out;
            will-change: transform;
            box-shadow: 0 0 8px rgba(59, 130, 246, 0.4);
        }
        /* CSS - Scoped to #skill-card-8 */
#skill-card-8 .skill-interactive {
    position: relative;
    background-color: #0a0a0a;
    overflow: hidden;
    border-radius: 12px;
    cursor: crosshair;
}

#skill-card-8 .grid {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: grid;
    gap: 0;
}

#skill-card-8 .grid-cell {
    background-color: #000000;
    transition: background-color 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    border: 0.5px solid rgba(255, 255, 255, 0.02);
}

#skill-card-8 .grid-cell.active {
    transition: background-color 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}

#skill-card-8 .grid-cell.fading {
    transition: background-color 1.2s cubic-bezier(0.4, 0, 0.2, 1);
}
